<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banda-farm.ru — Кинозал Yarikudza</title>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Kinobox Player Engine -->
    <script src="https://kinobox.tv/kinobox.min.js" async></script>

    <style>
        :root {
            --bg-base: #07090e;
            --bg-surface: rgba(18, 22, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-red: #ef4444;
            --accent-kinogo: #ff5500;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glass-blur: blur(20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.1) 0%, transparent 45%);
        }

        /* Top Bar */
        header.sys-header {
            height: 52px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 500;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .brand-logo i {
            color: var(--accent-red);
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6));
        }

        .user-tag {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--accent-red);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* App Grid Layout */
        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Panels */
        .panel {
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Search input */
        .search-wrapper {
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 14px 16px 14px 44px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .search-wrapper input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        .search-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        /* Buttons */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-horror {
            background: linear-gradient(135deg, var(--accent-red), #991b1b);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-horror:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
        }

        .btn-kinogo {
            background: linear-gradient(135deg, var(--accent-kinogo), #c2410c);
            color: white;
            border: none;
        }

        .btn-bookmark {
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.4);
            color: var(--accent-pink);
        }

        .btn-bookmark:hover {
            background: rgba(236, 72, 153, 0.4);
        }

        /* Smart Random Card */
        .random-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .random-output {
            font-size: 16px;
            font-weight: 800;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fca5a5;
            margin: 10px 0;
        }

        /* Catalog Grid */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 16px;
            overflow-y: auto;
            max-height: 62vh;
            padding-right: 4px;
        }

        .movie-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-red);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.2);
        }

        .movie-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .badge-top {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #facc15;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .card-fav-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card-fav-btn:hover, .card-fav-btn.active {
            background: var(--accent-pink);
            color: white;
            border-color: var(--accent-pink);
        }

        .movie-card-body {
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .movie-card-title {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Watchlist Items */
        .fav-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .fav-item-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Player Overlay */
        .player-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .player-modal.active { display: flex; }

        .player-content {
            width: 90vw;
            max-width: 1100px;
            height: 80vh;
            background: #000;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .player-header {
            padding: 12px 20px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="sys-header">
        <div class="brand-logo">
            <i class="fa-solid fa-ghost"></i>
            <span>banda-farm.ru</span>
        </div>
        
        <div class="user-tag">
            <i class="fa-solid fa-user-shield"></i> Yarikudza
        </div>
    </header>

    <!-- Main App -->
    <div class="app-container">

        <!-- Left Column -->
        <aside class="panel">
            <div class="panel-title"><i class="fa-solid fa-magnifying-glass"></i> Найти фильм</div>
            
            <div class="search-wrapper">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Поиск фильма..." onkeypress="if(event.key==='Enter') triggerSearch();">
            </div>

            <div style="display: flex; gap: 8px;">
                <button class="btn btn-horror" style="flex:1;" onclick="triggerSearch()"><i class="fa-solid fa-play"></i> Смотреть</button>
                <button class="btn btn-kinogo" onclick="openKinogoDirect()" title="Искать напрямую на kinogo.media"><i class="fa-solid fa-external-link"></i> kinogo.media</button>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color);">

            <div class="panel-title"><i class="fa-solid fa-skull"></i> Категории Ужасов</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="btn" onclick="filterCatalog('all')">🔥 Все ТОП ужасы</button>
                <button class="btn" onclick="filterCatalog('psychological')">🧠 Психологические триллеры</button>
                <button class="btn" onclick="filterCatalog('paranormal')">👻 Мистика и призраки</button>
                <button class="btn" onclick="filterCatalog('slasher')">🔪 Слешеры и Монстры</button>
            </div>
        </aside>

        <!-- Center Column -->
        <main class="panel">
            <!-- Smart Randomizer Card -->
            <div class="random-box">
                <div style="font-size: 13px; color: var(--text-sub);">Выбирает ТОЛЬКО лучшее из категории Ужасы/Триллеры</div>
                <div class="random-output" id="randomOutput">Готовы к просмотру?</div>
                <button class="btn btn-horror" style="margin: 0 auto;" onclick="pickBestRandom()"><i class="fa-solid fa-dice"></i> Подобрать ТОП Фильм</button>
            </div>

            <div class="panel-title" id="catalogTitle"><i class="fa-solid fa-fire"></i> ТОП Ужасы & Триллеры на вечер</div>

            <!-- Movies Grid -->
            <div class="catalog-grid" id="catalogGrid"></div>
        </main>

        <!-- Right Column: Watchlist -->
        <aside class="panel">
            <div class="panel-title"><i class="fa-solid fa-bookmark" style="color: var(--accent-pink);"></i> Наш выбор</div>
            <div id="watchlist" style="display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto;">
                <!-- Watchlist loaded dynamically -->
            </div>
        </aside>

    </div>

    <!-- Player Modal -->
    <div class="player-modal" id="playerModal">
        <div class="player-content">
            <div class="player-header">
                <span id="playerTitle" style="font-weight: 700;">Просмотр</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-bookmark" style="padding: 4px 10px; font-size: 12px;" onclick="addCurrentToFav()"><i class="fa-solid fa-plus"></i> В Наш выбор</button>
                    <button class="btn btn-kinogo" style="padding: 4px 10px; font-size: 12px;" onclick="openKinogoCurrent()">На kinogo.media</button>
                    <button class="btn" style="padding: 4px 10px;" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="kinobox_player" style="flex: 1; width: 100%;"></div>
        </div>
    </div>

    <script>
        const topHorrors = [
            { id: 1, title: "Заклятие", category: "paranormal", rating: "7.8", img: "https://m.media-amazon.com/images/M/MVBMTM3NjUyODI5N15BMl5BanBnXkFtZTcwNjA2MDAwOQ@@._V1_SX300.jpg" },
            { id: 2, title: "Астрал", category: "paranormal", rating: "7.5", img: "https://m.media-amazon.com/images/M/MVBMTM4MTA2Mjk1NV5BMl5BanBnXkFtZTgwNDk3MTEyMTE@._V1_SX300.jpg" },
            { id: 3, title: "Реинкарнация", category: "psychological", rating: "7.3", img: "https://m.media-amazon.com/images/M/MVBOTU5NDA3MzA5M15BMl5BanBnXkFtZTgwMDM2MjE1NTM@._V1_SX300.jpg" },
            { id: 4, title: "Сияние", category: "psychological", rating: "8.4", img: "https://m.media-amazon.com/images/M/MVBMTI0MTU3Njg4MF5BMl5BanBnXkFtZTcwOTI5NTMyNA@@._V1_SX300.jpg" },
            { id: 5, title: "Тихое место", category: "slasher", rating: "7.5", img: "https://m.media-amazon.com/images/M/MVBMjI0MDMyOTA3MV5BMl5BanBnXkFtZTgwNDM2OTEyNDM@._V1_SX300.jpg" },
            { id: 6, title: "Оно", category: "slasher", rating: "7.3", img: "https://m.media-amazon.com/images/M/MVBZDVk1M2FlMTItMDg4NC00NWY2LWE1N2YtZDRlMTlkZGZhYWRiXkEyXkFqcGdeQXVyNTIzOTk5ODM@._V1_SX300.jpg" },
            { id: 7, title: "Прочь", category: "psychological", rating: "7.7", img: "https://m.media-amazon.com/images/M/MVBMjUxMDcxMzAyN15BMl5BanBnXkFtZTgwMTk3MDA4MDI@._V1_SX300.jpg" },
            { id: 8, title: "Солнцестояние", category: "psychological", rating: "7.1", img: "https://m.media-amazon.com/images/M/MVBMzU2MmI5M2ItMGM2OC00Y2ZhLWEwNWQtMTE4MDhhYjNmYmU3XkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_SX300.jpg" }
        ];

        let activeMovieTitle = "";
        let savedWatchlist = JSON.parse(localStorage.getItem('banda_farm_favs')) || [];

        // Save & Load Watchlist
        function updateWatchlistStorage() {
            localStorage.setItem('banda_farm_favs', JSON.stringify(savedWatchlist));
            renderWatchlist();
            renderCatalog(topHorrors);
        }

        function toggleFavorite(title) {
            const index = savedWatchlist.indexOf(title);
            if (index > -1) {
                savedWatchlist.splice(index, 1);
            } else {
                savedWatchlist.push(title);
            }
            updateWatchlistStorage();
        }

        function addCurrentToFav() {
            if (activeMovieTitle && !savedWatchlist.includes(activeMovieTitle)) {
                savedWatchlist.push(activeMovieTitle);
                updateWatchlistStorage();
            }
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlist');
            if (savedWatchlist.length === 0) {
                container.innerHTML = `<p style="font-size: 12px; color: var(--text-sub); text-align: center; margin-top: 20px;">Список пока пуст</p>`;
                return;
            }

            container.innerHTML = savedWatchlist.map(t => `
                <div class="fav-item">
                    <span class="fav-item-title">${t}</span>
                    <div style="display:flex; gap:6px;">
                        <button class="btn btn-horror" style="padding: 4px 8px; font-size:11px;" onclick="playMovie('${t}')"><i class="fa-solid fa-play"></i></button>
                        <button class="btn" style="padding: 4px 8px; font-size:11px;" onclick="toggleFavorite('${t}')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // Render catalog
        function renderCatalog(list) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = list.map(m => {
                const isFav = savedWatchlist.includes(m.title);
                return `
                <div class="movie-card">
                    <button class="card-fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${m.title}')" title="Добавить в Наш выбор">
                        <i class="fa-solid fa-bookmark"></i>
                    </button>
                    <span class="badge-top">★ ${m.rating}</span>
                    <img src="${m.img}" alt="${m.title}" onclick="playMovie('${m.title}')">
                    <div class="movie-card-body" onclick="playMovie('${m.title}')">
                        <div class="movie-card-title">${m.title}</div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Search & Play
        function playMovie(title) {
            activeMovieTitle = title;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerModal').classList.add('active');
            
            if (window.Kinobox) {
                new Kinobox('.kinobox_player', {
                    search: { query: title }
                }).init();
            }
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.remove('active');
            document.querySelector('.kinobox_player').innerHTML = '';
        }

        // Direct search on kinogo.media
        function openKinogoDirect() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.open(`https://kinogo.media/index.php?do=search&subaction=search&story=${encodeURIComponent(query)}`, '_blank');
            } else {
                window.open('https://kinogo.media', '_blank');
            }
        }

        function openKinogoCurrent() {
            if (activeMovieTitle) {
                window.open(`https://kinogo.media/index.php?do=search&subaction=search&story=${encodeURIComponent(activeMovieTitle)}`, '_blank');
            }
        }

        function triggerSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) playMovie(query);
        }

        function pickBestRandom() {
            const out = document.getElementById('randomOutput');
            let count = 0;
            const timer = setInterval(() => {
                const tempMovie = topHorrors[Math.floor(Math.random() * topHorrors.length)];
                out.innerText = tempMovie.title + " (★ " + tempMovie.rating + ")";
                count++;
                if (count > 10) {
                    clearInterval(timer);
                }
            }, 70);
        }

        function filterCatalog(cat) {
            if (cat === 'all') {
                renderCatalog(topHorrors);
            } else {
                const filtered = topHorrors.filter(m => m.category === cat);
                renderCatalog(filtered);
            }
        }

        renderCatalog(topHorrors);
        renderWatchlist();
    </script>
</body>
</html>
